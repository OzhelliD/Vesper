<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vesper</title>
<style>
@import url("https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Exo+2:wght@300;400;500&display=swap");

:root {
  --bg:      #060d1a;
  --bg2:     #0a1628;
  --bg3:     #0f1f38;
  --border:  #1a3a5c;
  --cyan:    #00d4ff;
  --cyan2:   #0099cc;
  --purple:  #7c3aed;
  --text:    #c8e0f4;
  --text2:   #4a7a9b;
  --text3:   #7aaec8;
  --green:   #00ff88;
  --red:     #ff4466;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: "Exo 2", sans-serif;
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

/* ── Fondo con grid ── */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(0,212,255,.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,212,255,.03) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events: none;
  z-index: 0;
}

/* ── Header ── */
.header {
  position: relative; z-index: 10;
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 24px;
  border-bottom: 1px solid var(--border);
  background: rgba(6,13,26,.8);
  backdrop-filter: blur(10px);
}

.logo {
  font-family: "Orbitron", monospace;
  font-size: 18px; font-weight: 700;
  letter-spacing: .2em;
  background: linear-gradient(135deg, var(--cyan), var(--purple));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}

.header-center {
  display: flex; align-items: center; gap: 8px;
}

.status-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--green);
  box-shadow: 0 0 10px var(--green);
  animation: pulse 2s infinite;
}
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

.header-right {
  display: flex; align-items: center; gap: 16px;
}

.clock {
  font-family: "Orbitron", monospace;
  font-size: 14px; color: var(--cyan);
  letter-spacing: .1em;
}

.weather-badge {
  font-size: 12px; color: var(--text3);
  padding: 4px 12px;
  border: 1px solid var(--border);
  border-radius: 99px;
  background: var(--bg3);
}

.user-badge {
  font-size: 11px; color: var(--cyan);
  padding: 4px 12px;
  border: 1px solid var(--cyan);
  border-radius: 99px;
  background: rgba(0,212,255,.05);
  font-family: "Orbitron", monospace;
  letter-spacing: .08em;
}

/* ── Layout principal ── */
.main {
  flex: 1; display: flex; overflow: hidden;
  position: relative; z-index: 1;
}

/* ── Panel izquierdo: historial ── */
.left-panel {
  width: 220px; flex-shrink: 0;
  border-right: 1px solid var(--border);
  background: rgba(10,22,40,.6);
  backdrop-filter: blur(10px);
  display: flex; flex-direction: column;
  overflow: hidden; padding: 16px 0;
}

.panel-title {
  font-family: "Orbitron", monospace;
  font-size: 9px; font-weight: 500;
  color: var(--text2); letter-spacing: .12em;
  text-transform: uppercase;
  padding: 0 14px 10px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 10px;
}

.history-item {
  padding: 8px 14px; cursor: pointer;
  transition: background .15s;
  border-left: 2px solid transparent;
}
.history-item:hover { background: rgba(0,212,255,.04); border-left-color: var(--cyan); }

.history-label {
  font-size: 11px; color: var(--text3);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  margin-bottom: 4px;
}

.history-bar {
  height: 2px; border-radius: 99px;
  background: var(--bg3); overflow: hidden;
}
.history-bar-fill {
  height: 100%; border-radius: 99px;
  background: linear-gradient(90deg, var(--cyan), var(--purple));
}

.history-pct {
  font-size: 9px; color: var(--text2); margin-top: 2px;
}

/* ── Centro: esfera ── */
.center {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  position: relative; overflow: hidden;
  padding: 8px 16px;
}

/* Glow de fondo */
.center::before {
  content: "";
  position: absolute;
  width: 500px; height: 500px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(0,212,255,.06) 0%, transparent 70%);
  pointer-events: none;
}

/* Esfera canvas */
.sphere-wrap {
  position: relative;
  width: 280px; height: 280px;
  margin-bottom: 24px;
}

#sphere-canvas {
  width: 280px; height: 280px;
  border-radius: 50%;
}

.sphere-ring {
  position: absolute; inset: -12px;
  border-radius: 50%;
  border: 1px solid rgba(0,212,255,.2);
  animation: rotateRing 8s linear infinite;
}
.sphere-ring-2 {
  position: absolute; inset: -24px;
  border-radius: 50%;
  border: 1px solid rgba(124,58,237,.15);
  animation: rotateRing 12s linear infinite reverse;
}
@keyframes rotateRing { to { transform: rotate(360deg); } }

.sphere-pulse {
  position: absolute; inset: -4px;
  border-radius: 50%;
  border: 2px solid transparent;
  background: transparent;
  transition: all .3s;
}
.sphere-pulse.active {
  border-color: var(--cyan);
  box-shadow: 0 0 30px rgba(0,212,255,.4), inset 0 0 30px rgba(0,212,255,.1);
  animation: spherePulse .8s ease-in-out infinite alternate;
}
@keyframes spherePulse {
  from { box-shadow: 0 0 20px rgba(0,212,255,.3); }
  to   { box-shadow: 0 0 50px rgba(0,212,255,.7), 0 0 80px rgba(0,212,255,.2); }
}

/* Transcripción */
.transcript {
  font-size: 13px; color: var(--text3);
  max-width: 420px; width: 90%;
  text-align: center;
  min-height: 20px; max-height: 80px;
  overflow-y: auto;
  margin-bottom: 8px;
  font-style: italic; letter-spacing: .02em;
  line-height: 1.5;
  scrollbar-width: none;
}
.transcript::-webkit-scrollbar { display: none; }

/* Estado */
.state-label {
  font-family: "Orbitron", monospace;
  font-size: 16px; font-weight: 700;
  letter-spacing: .15em;
  color: var(--cyan);
  text-shadow: 0 0 20px rgba(0,212,255,.5);
  margin-bottom: 24px;
  min-height: 24px;
}

/* Botón mic */
.mic-btn {
  width: 56px; height: 56px;
  border-radius: 50%;
  border: 2px solid var(--cyan);
  background: rgba(0,212,255,.08);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all .2s;
  box-shadow: 0 0 20px rgba(0,212,255,.2);
}
.mic-btn:hover {
  background: rgba(0,212,255,.15);
  box-shadow: 0 0 30px rgba(0,212,255,.4);
  transform: scale(1.05);
}
.mic-btn.recording {
  border-color: var(--red);
  background: rgba(255,68,102,.1);
  box-shadow: 0 0 30px rgba(255,68,102,.4);
  animation: micPulse .6s infinite alternate;
}
@keyframes micPulse {
  from { box-shadow: 0 0 20px rgba(255,68,102,.3); }
  to   { box-shadow: 0 0 50px rgba(255,68,102,.7); }
}

/* Input texto */
.text-input-wrap {
  display: flex; align-items: flex-end; gap: 10px;
  margin-top: 8px;
  width: 100%; max-width: 560px; padding: 0 20px;
  flex-shrink: 0;
}

.text-input {
  flex: 1; padding: 10px 16px;
  background: rgba(10,22,40,.8);
  border: 1px solid var(--border);
  border-radius: 99px;
  color: var(--text);
  font-family: "Exo 2", sans-serif;
  font-size: 13px; outline: none;
  transition: border-color .2s;
}
.text-input:focus { border-color: var(--cyan); }
.text-input::placeholder { color: var(--text2); }

.send-btn {
  width: 40px; height: 40px;
  border-radius: 50%;
  border: none;
  background: linear-gradient(135deg, var(--cyan), var(--purple));
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all .2s; flex-shrink: 0;
}
.send-btn:hover { transform: scale(1.08); opacity: .9; }
.send-btn:disabled { opacity: .3; cursor: not-allowed; transform: none; }

.tts-btn {
  width: 36px; height: 36px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: var(--bg3);
  color: var(--text2); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; transition: all .15s; flex-shrink: 0;
}
.tts-btn.on { border-color: var(--green); color: var(--green); }

/* ── Chat drawer (desliza desde abajo) ── */
.chat-drawer {
  width: 100%; max-width: 600px;
  height: 0; overflow: hidden;
  background: rgba(6,13,26,.95);
  backdrop-filter: blur(20px);
  border: 1px solid var(--border);
  border-radius: 12px;
  transition: height .4s cubic-bezier(.4,0,.2,1);
  margin-bottom: 6px;
}
.chat-drawer.open { height: 280px; }

.chat-messages {
  height: 100%; overflow-y: auto;
  padding: 14px 20px;
  display: flex; flex-direction: column; gap: 10px;
  scroll-behavior: smooth;
}
.chat-messages::-webkit-scrollbar { width: 3px; }
.chat-messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.msg { display: flex; gap: 8px; max-width: 75%; animation: fadeUp .2s ease; }
@keyframes fadeUp { from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:translateY(0)} }
.msg.user { align-self: flex-end; flex-direction: row-reverse; }
.msg.assistant { align-self: flex-start; }
.msg-av {
  width: 24px; height: 24px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 9px; font-weight: 700; font-family: "Orbitron", monospace;
}
.msg.user .msg-av { background: var(--purple); color: #fff; }
.msg.assistant .msg-av { background: linear-gradient(135deg,var(--cyan),var(--purple)); color: #fff; }
.msg-bubble {
  padding: 8px 12px; border-radius: 10px;
  font-size: 12px; line-height: 1.6;
}
.msg.user .msg-bubble { background: rgba(124,58,237,.2); border: 1px solid rgba(124,58,237,.4); border-bottom-right-radius: 3px; }
.msg.assistant .msg-bubble { background: rgba(0,212,255,.06); border: 1px solid rgba(0,212,255,.2); border-bottom-left-radius: 3px; }
.msg-time { font-size: 9px; color: var(--text2); margin-top: 3px; }
.msg.user .msg-time { text-align: right; }
.typing { display:flex; gap:4px; align-items:center; padding:8px 12px; }
.typing span { width:4px; height:4px; border-radius:50%; background:var(--cyan); animation:bounce 1.2s infinite; }
.typing span:nth-child(2){animation-delay:.2s} .typing span:nth-child(3){animation-delay:.4s}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-4px);opacity:1}}

.chat-toggle {
  position: relative;
  font-family: "Orbitron", monospace;
  font-size: 9px; letter-spacing: .1em;
  color: var(--text2); cursor: pointer;
  display: flex; align-items: center; gap: 6px;
  padding: 5px 14px;
  border: 1px solid var(--border); border-radius: 99px;
  background: var(--bg3); transition: all .2s;
  z-index: 5;
  margin: 6px auto 0;
  width: fit-content;
}
.chat-toggle:hover { border-color: var(--cyan); color: var(--cyan); }

/* ── Panel derecho ── */
.right-panel {
  width: 240px; flex-shrink: 0;
  border-left: 1px solid var(--border);
  background: rgba(10,22,40,.6);
  backdrop-filter: blur(10px);
  display: flex; flex-direction: column;
  overflow-y: auto; padding: 16px 0;
}
.right-panel::-webkit-scrollbar { width: 3px; }
.right-panel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.r-section { padding: 0 14px 16px; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
.r-section:last-child { border-bottom: none; margin-bottom: 0; }

/* Spotify */
.sp-connect-box {
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  padding: 16px 10px;
  background: rgba(29,185,84,.05);
  border-radius: 10px; border: 1px solid rgba(29,185,84,.3);
  cursor: pointer; transition: all .2s;
}
.sp-connect-box:hover { background: rgba(29,185,84,.1); border-color: #1DB954; }
.sp-connect-text { font-family:"Orbitron",monospace; font-size:10px; color:#1DB954; letter-spacing:.08em; }
.sp-connect-sub { font-size:10px; color:var(--text2); }

.now-playing-card { display:flex; flex-direction:column; gap:10px; }
.album-art {
  width:100%; aspect-ratio:1; border-radius:8px; overflow:hidden;
  background:var(--bg3); border:1px solid var(--border);
  display:flex; align-items:center; justify-content:center;
  font-size:28px;
}
.album-art img { width:100%; height:100%; object-fit:cover; }
.track-name { font-size:12px; font-weight:600; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.track-artist { font-size:11px; color:var(--text3); margin-top:2px; }
.progress-bar { height:2px; background:var(--bg3); border-radius:99px; overflow:hidden; margin-top:6px; }
.progress-fill { height:100%; background:#1DB954; border-radius:99px; transition:width .5s linear; }
.prog-times { display:flex; justify-content:space-between; font-size:9px; color:var(--text2); margin-top:3px; }

/* Estado del día */
.day-time {
  font-family:"Orbitron",monospace; font-size:26px; font-weight:700;
  background:linear-gradient(135deg,var(--cyan),var(--purple));
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  line-height:1;
}
.day-date { font-size:10px; color:var(--text2); margin-top:3px; margin-bottom:10px; text-transform:capitalize; }
.weather-row { display:flex; align-items:center; gap:8px; padding-top:8px; border-top:1px solid var(--border); }
.weather-icon-big { font-size:22px; }
.weather-temp { font-size:13px; font-weight:600; color:var(--text); }
.weather-desc { font-size:10px; color:var(--text3); text-transform:capitalize; }

/* Accesos contextuales */
.ctx-btn {
  width:100%; padding:7px 10px; margin-bottom:4px;
  background:rgba(0,212,255,.04); border:1px solid var(--border);
  border-radius:8px; color:var(--text3); font-size:11px;
  font-family:"Exo 2",sans-serif; cursor:pointer; text-align:left;
  transition:all .15s; display:flex; align-items:center; gap:7px;
}
.ctx-btn:hover { border-color:var(--cyan); color:var(--cyan); background:rgba(0,212,255,.08); }

/* Modal rutina de despertar */
.routine-modal {
  position: fixed; inset: 0; z-index: 300;
  background: rgba(6,13,26,.97);
  display: none; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 20px; padding: 24px;
  backdrop-filter: blur(20px);
}
.routine-modal.active { display: flex; }
.routine-phase-label {
  font-family: "Orbitron", monospace;
  font-size: 11px; letter-spacing: .2em;
  color: var(--cyan); text-transform: uppercase;
}
.routine-title {
  font-family: "Orbitron", monospace;
  font-size: 20px; font-weight: 700;
  background: linear-gradient(135deg, var(--cyan), var(--purple));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  text-align: center;
}
.routine-subtitle {
  font-size: 13px; color: var(--text3);
  text-align: center; max-width: 320px; line-height: 1.6;
}
.routine-yt {
  width: 100%; max-width: 480px;
  aspect-ratio: 16/9;
  border-radius: 12px; overflow: hidden;
  border: 1px solid var(--border);
}
.routine-yt iframe { width: 100%; height: 100%; border: none; }
.routine-cancel {
  padding: 8px 20px;
  border: 1px solid var(--border); border-radius: 99px;
  background: transparent; color: var(--text2);
  font-family: "Exo 2", sans-serif; font-size: 11px;
  cursor: pointer; transition: all .2s;
}
.routine-cancel:hover { border-color: var(--red); color: var(--red); }
.routine-speech {
  font-size: 14px; color: var(--text);
  text-align: center; max-width: 360px;
  line-height: 1.8; font-style: italic;
}

/* Notificaciones */
.notif-toast {
  position:fixed; top:70px; right:20px;
  background:rgba(6,13,26,.95); border:1px solid var(--cyan);
  border-radius:10px; padding:12px 16px; z-index:200; max-width:280px;
  animation:slideIn .3s ease; box-shadow:0 0 20px rgba(0,212,255,.2);
  backdrop-filter:blur(10px);
}
.notif-title { font-family:"Orbitron",monospace; font-size:10px; color:var(--cyan); margin-bottom:4px; letter-spacing:.08em; }
.notif-body { font-size:11px; color:var(--text3); line-height:1.5; }
.notif-close { position:absolute; top:8px; right:10px; cursor:pointer; color:var(--text2); }
@keyframes slideIn { from{transform:translateX(20px);opacity:0} to{transform:translateX(0);opacity:1} }

/* Overlay PIN */
.overlay {
  position:fixed; inset:0;
  background:rgba(6,13,26,.97);
  display:flex; align-items:center; justify-content:center; z-index:100;
}
.box {
  background:rgba(10,22,40,.9); border:1px solid var(--border);
  border-radius:16px; padding:32px; width:320px; text-align:center;
  backdrop-filter:blur(20px);
}
.box-title {
  font-family:"Orbitron",monospace; font-size:20px; font-weight:700;
  letter-spacing:.2em;
  background:linear-gradient(135deg,var(--cyan),var(--purple));
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  margin-bottom:6px;
}
.box-sub { font-size:12px; color:var(--text3); margin-bottom:20px; }
.oi {
  width:100%; padding:10px 14px;
  background:rgba(10,22,40,.8); border:1px solid var(--border);
  border-radius:8px; color:var(--text);
  font-family:"Exo 2",sans-serif; font-size:13px; outline:none;
  margin-bottom:8px; transition:border-color .2s;
}
.oi:focus { border-color:var(--cyan); }
.ob {
  width:100%; padding:10px;
  background:linear-gradient(135deg,var(--cyan),var(--purple));
  border:none; border-radius:8px; color:#fff;
  font-family:"Orbitron",monospace; font-size:12px; font-weight:600;
  letter-spacing:.1em; cursor:pointer; margin-bottom:8px;
}
.skip { font-size:11px; color:var(--text2); cursor:pointer; display:block; text-decoration:underline; }
.pin-error { color:var(--red); font-size:11px; margin-bottom:6px; display:none; }

/* OUTFITS ELIMINADO */

/* Finanzas */
.finance-card {
  background:var(--bg3); border-radius:10px;
  padding:14px; border:1px solid var(--border);
}
.finance-label { font-size:9px; color:var(--text2); letter-spacing:.06em; text-transform:uppercase; margin-bottom:4px; }
.finance-amount {
  font-family:"Orbitron",monospace; font-size:24px; font-weight:700;
  color:var(--green); line-height:1; margin-bottom:10px;
  text-shadow:0 0 20px rgba(0,255,136,.3);
}
.finance-spent-row { display:flex; justify-content:space-between; margin-bottom:10px; }
.finance-spent { font-family:"Orbitron",monospace; font-size:13px; color:var(--red); font-weight:600; }
.finance-debt  { font-family:"Orbitron",monospace; font-size:13px; color:#f59e0b; font-weight:600; }
.finance-bar-wrap { margin-top:4px; }
.finance-bar { height:3px; background:rgba(255,255,255,.1); border-radius:99px; overflow:hidden; }
.finance-bar-fill { height:100%; border-radius:99px; background:linear-gradient(90deg,var(--green),var(--red)); transition:width .5s; }
.finance-bar-label { font-size:9px; color:var(--text2); margin-top:3px; text-align:right; }

/* Playlists */
.playlist-item {
  display:flex; align-items:center; gap:8px;
  padding:6px 8px; border-radius:8px;
  cursor:pointer; transition:all .15s;
  border:1px solid transparent;
}
.playlist-item:hover { background:rgba(0,212,255,.06); border-color:var(--border); }
.playlist-thumb {
  width:36px; height:36px; border-radius:4px;
  object-fit:cover; flex-shrink:0; background:var(--bg3);
  display:flex; align-items:center; justify-content:center;
  font-size:14px;
}
.playlist-thumb img { width:100%; height:100%; object-fit:cover; border-radius:4px; }
.playlist-name { font-size:11px; color:var(--text3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.playlist-total { font-size:9px; color:var(--text2); margin-top:2px; }

/* ── Responsivo ── */
@media(max-width:1100px){
  .left-panel{ width:180px; }
  .right-panel{ width:200px; }
}

@media(max-width:900px){
  .left-panel{ display:none !important; }
  .right-panel{ display:none !important; }
  .main{ flex-direction:column; }
  .center{
    flex:1; width:100%;
    padding:0 16px;
    justify-content:center;
  }
  .sphere-wrap{ width:220px; height:220px; margin-bottom:16px; }
  #sphere-canvas{ width:220px; height:220px; }
  .state-label{ font-size:13px; margin-bottom:16px; }
  .transcript{ font-size:12px; max-width:85vw; }
  .chat-drawer.open{ height:220px; }
  .text-input-wrap{ max-width:100%; padding:0 12px; }
}

@media(max-width:600px){
  .header{ padding:10px 14px; flex-wrap:nowrap; gap:6px; }
  .header-center{ display:none; }
  .logo{ font-size:13px; letter-spacing:.12em; }

<script>
// ── Estado global ─────────────────────────────────────────────────────────────
let rec=null, isRec=false, tts=false, busy=false, cu="Ozhelli";
let chatOpen=false, spotifyConnected=false;
let cmdHistory=[];

// ── Esfera animada ────────────────────────────────────────────────────────────
const canvas = document.getElementById("sphere-canvas");
const ctx2   = canvas.getContext("2d");
const W = 280, H = 280, CX = W/2, CY = H/2, R = 100;

let particles = [];
let animState = "idle"; // idle | listening | thinking | speaking
let animFrame = 0;

function initParticles(){
  particles = [];
  for(let i=0;i<120;i++){
    const theta = Math.random()*Math.PI*2;
    const phi   = Math.acos(2*Math.random()-1);
    particles.push({
      theta, phi,
      r: R + (Math.random()-0.5)*6,
      size: Math.random()*1.5+0.5,
      speed: (Math.random()-0.5)*0.003,
      opacity: Math.random()*0.6+0.2
    });
  }
}

function drawSphere(){
  ctx2.clearRect(0,0,W,H);
  animFrame++;

  // Gradiente de fondo de la esfera
  const grad = ctx2.createRadialGradient(CX,CY,0,CX,CY,R*1.2);
  const intensity = animState==="listening" ? 0.15 :
                    animState==="thinking"  ? 0.1  :
                    animState==="speaking"  ? 0.12 : 0.06;
  grad.addColorStop(0, `rgba(0,212,255,${intensity})`);
  grad.addColorStop(0.5, `rgba(0,100,180,${intensity*0.5})`);
  grad.addColorStop(1, "rgba(0,0,0,0)");
  ctx2.fillStyle = grad;
  ctx2.beginPath();
  ctx2.arc(CX,CY,R*1.1,0,Math.PI*2);
  ctx2.fill();

  // Waveform ring
  const waveAmp = animState==="idle"      ? 4  :
                  animState==="listening" ? 18 :
                  animState==="thinking"  ? 10 :
                  animState==="speaking"  ? 22 : 4;

  ctx2.beginPath();
  for(let a=0;a<Math.PI*2;a+=0.02){
    const noise = Math.sin(a*6+animFrame*0.08)*waveAmp +
                  Math.sin(a*3+animFrame*0.05)*waveAmp*0.5;
    const rr = R + noise;
    const x  = CX + rr*Math.cos(a);
    const y  = CY + rr*Math.sin(a);
    a===0 ? ctx2.moveTo(x,y) : ctx2.lineTo(x,y);
  }
  ctx2.closePath();
  const wColor = animState==="listening" ? "rgba(255,68,102,0.6)" :
                 animState==="speaking"  ? "rgba(0,255,136,0.6)"  :
                                           "rgba(0,212,255,0.4)";
  ctx2.strokeStyle = wColor;
  ctx2.lineWidth   = 1.5;
  ctx2.stroke();

  // Segunda onda
  ctx2.beginPath();
  for(let a=0;a<Math.PI*2;a+=0.02){
    const noise = Math.sin(a*4+animFrame*0.06+1)*waveAmp*0.7;
    const rr = R*0.75 + noise;
    const x  = CX + rr*Math.cos(a);
    const y  = CY + rr*Math.sin(a);
    a===0 ? ctx2.moveTo(x,y) : ctx2.lineTo(x,y);
  }
  ctx2.closePath();
  ctx2.strokeStyle = wColor.replace("0.6","0.25").replace("0.4","0.2");
  ctx2.lineWidth   = 1;
  ctx2.stroke();

  // Partículas
  particles.forEach(p => {
    p.theta += p.speed + (animState!=="idle" ? p.speed*2 : 0);
    const x = CX + p.r*Math.sin(p.phi)*Math.cos(p.theta);
    const y = CY + p.r*Math.sin(p.phi)*Math.sin(p.theta);
    const z = p.r*Math.cos(p.phi);
    if(z < 0) return;
    const alpha = p.opacity * (animState!=="idle" ? 1.4 : 0.8);
    ctx2.beginPath();
    ctx2.arc(x,y,p.size,0,Math.PI*2);
    ctx2.fillStyle = `rgba(0,212,255,${Math.min(alpha,1)})`;
    ctx2.fill();
  });

  // Brillo central
  const centerGrad = ctx2.createRadialGradient(CX,CY,0,CX,CY,R*0.4);
  centerGrad.addColorStop(0,`rgba(0,212,255,${intensity*0.8})`);
  centerGrad.addColorStop(1,"rgba(0,0,0,0)");
  ctx2.fillStyle = centerGrad;
  ctx2.beginPath();
  ctx2.arc(CX,CY,R*0.4,0,Math.PI*2);
  ctx2.fill();

  requestAnimationFrame(drawSphere);
}

function setAnimState(state){
  animState = state;
  const pulse = document.getElementById("sphere-pulse");
  pulse.classList.toggle("active", state!=="idle");
  const labels = {idle:"EN ESPERA",listening:"ESCUCHANDO...",thinking:"PROCESANDO...",speaking:"RESPONDIENDO..."};
  document.getElementById("state-label").textContent = labels[state]||"EN ESPERA";
  document.getElementById("status-label").textContent = state==="idle" ? "SISTEMA ACTIVO" : labels[state];
}

initParticles();
drawSphere();

// [auto-login movido al final]

// ── Init ──────────────────────────────────────────────────────────────────────
window.doInit = async function doInit(force){
  const nameInput = document.getElementById("ni").value.trim();
  const name      = force || nameInput || "Ozhelli";
  const pinWrap   = document.getElementById("pin-wrap");
  const pinInput  = document.getElementById("pi");
  const pin       = pinInput?.value.trim() || "";

  // Si campo nombre vacío y PIN no visible aún — mostrar PIN
  if(!nameInput && !force && pinWrap.style.display === "none"){
    pinWrap.style.display = "block";
    pinInput.focus();
    return;
  }

  try {
    // Obtener ubicacion del cliente desde el navegador
    let clientLocation = null;
    try {
      const geoR = await fetch("https://ipapi.co/json/");
      const geoD = await geoR.json();
      if(geoD.city){
        clientLocation = {
          status: "success",
          city: geoD.city,
          regionName: geoD.region,
          countryCode: geoD.country_code,
          lat: geoD.latitude,
          lon: geoD.longitude,
          timezone: geoD.timezone
        };
      }
    } catch(e){ console.log("[GEO] Error:", e); }

    const r = await fetch("/api/init",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({name, pin, client_location: clientLocation})});
    const d = await r.json();
    if(d.pin_required){
      pinWrap.style.display = "block";
      pinInput.focus();
      if(pin) document.getElementById("pin-err").style.display = "block";
      return;
    }
    document.getElementById("ov").style.display="none";
    cu = d.user||name;
    // Guardar sesion en localStorage para no pedir login en cada refresh
    // Solo guardar sesión automática para owner
    // Determinar tipo de usuario PRIMERO
    const isOwner = d.user_type === "owner";

    // Guardar sesion solo para owner
    if(isOwner){
      localStorage.setItem("vesper_user", cu);
      localStorage.setItem("vesper_pin",  pin);
    }

    // Badge
    const ubadge = document.getElementById("ubadge");
    ubadge.textContent = isOwner ? "SR. " + cu.toUpperCase() : "INVITADO · " + cu.toUpperCase();
    ubadge.style.borderColor = isOwner ? "var(--cyan)" : "var(--text2)";
    ubadge.style.color       = isOwner ? "var(--cyan)"  : "var(--text2)";

    // Clima
    if(d.weather?.temp_c){
      document.getElementById("wbadge").textContent = "🌤 "+d.weather.temp_c+"°C";
      const icons={"clear":"☀️","clouds":"⛅","rain":"🌧️","thunderstorm":"⛈️","snow":"❄️","mist":"🌫️","drizzle":"🌦️"};
      const desc=(d.weather.description||"").toLowerCase();
      const icon=Object.entries(icons).find(([k])=>desc.includes(k))?.[1]||"🌤";
      const wi=document.getElementById("w-icon"); if(wi) wi.textContent=icon;
      const wt=document.getElementById("w-temp"); if(wt) wt.textContent=d.weather.temp_c+"°C — sens. "+(d.weather.feels_like||"?")+"°C";
      const wd=document.getElementById("w-desc"); if(wd) wd.textContent=d.weather.description||"";
    }

    // Mostrar/ocultar paneles segun tipo de usuario
    const rp = document.querySelector(".right-panel");
    const lp = document.querySelector(".left-panel");
    if(rp) rp.style.display = isOwner ? "flex" : "none";
    if(lp) lp.style.display = isOwner ? "flex" : "none";

    // Spotify y polling solo para owner
    if(isOwner){
      updateSpotifyPanel(d.spotify_connected||false);
      loadSpotify(); // Carga Now Playing
      startRoutinePolling(); // escucha fases de rutina de despertar
    }

    document.getElementById("chat-toggle-btn").style.display="flex";
    const msg = d.welcome||"Listo para asistirle, señor.";
    document.getElementById("transcript").textContent = msg;
    addMsg("assistant",msg);
    if(tts) speakText(msg);
  } catch(e){
    document.getElementById("ov").style.display="none";
    cu=name;
    document.getElementById("ubadge").textContent="SR. "+name.toUpperCase();
    document.getElementById("chat-toggle-btn").style.display="flex";
  }
}
document.getElementById("ni").addEventListener("keydown",e=>{if(e.key==="Enter")doInit();});
document.addEventListener("DOMContentLoaded",()=>{
  const pi=document.getElementById("pi");
  if(pi) pi.addEventListener("keydown",e=>{if(e.key==="Enter")doInit();});
});

// ── Chat ──────────────────────────────────────────────────────────────────────
window.send = async function send(){
  const ti=document.getElementById("ti");
  const txt=ti.value.trim();
  if(!txt||busy)return;
  busy=true; ti.value="";
  document.getElementById("sendBtn").disabled=true;

  // Mostrar en transcript y abrir chat
  document.getElementById("transcript").textContent=txt;
  if(!chatOpen) toggleChat();
  addMsg("user", txt);
  addHistory(txt);
  setAnimState("thinking");
  addTyping();

  try {
    const payload = {message: txt, user: cu};
    if(_attachedImage){
      payload.image_base64  = _attachedImage.base64;
      payload.image_type    = _attachedImage.mediaType;
      // Mostrar preview en el chat
      addMsg("user-img", _attachedImage.base64, _attachedImage.mediaType);
      clearImage();
    }
    const r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
    const d=await r.json();
    removeTyping();
    setAnimState("speaking");
    if(d.response){
      addMsg("assistant",d.response);
      document.getElementById("transcript").textContent = d.response.replace(/[*][*]/g,"").replace(/[*]/g,"").replace(/[`]/g,"");
      if(tts){
        speakText(d.response); // speakText limpia el markdown internamente
      } else {
        setTimeout(()=>setAnimState("idle"),2000);
      }
    } else if(d.error){
      addMsg("assistant","⚠️ "+d.error);
      setAnimState("idle");
    }
    if(d.music_action){
      const ma=d.music_action;
      if(ma.action==="spotify_login_required"){
        addMsg("assistant","Abriendo Spotify para autorizar, señor...");
        setTimeout(()=>window.open("/spotify/login","_blank","width=500,height=700"),500);
      } else if(ma.action==="play_song"){
        addMsg("assistant","▶️ Reproduciendo: "+ma.name+" — "+ma.artist);
      } else if(ma.action==="create_playlist"){
        addMsg("assistant","✅ Playlist \""+ma.playlist_name+"\" creada con "+ma.total+" canciones.");
      }
    }
  } catch(e){
    removeTyping();
    addMsg("assistant","⚠️ Error de conexión.");
    setAnimState("idle");
  }
  busy=false;
  document.getElementById("sendBtn").disabled=false;
}

const tiEl = document.getElementById("ti");
tiEl.addEventListener("keydown", e=>{
  if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); send(); }
});
tiEl.addEventListener("input", function(){
  this.style.height = "auto";
  this.style.height = Math.min(this.scrollHeight, 200) + "px";
});

function addHistory(cmd){
  cmdHistory.unshift({cmd,pct:Math.floor(Math.random()*60)+40});
  if(cmdHistory.length>8) cmdHistory.pop();
  const el=document.getElementById("history-list");
  el.innerHTML=cmdHistory.map(h=>`
    <div class="history-item" onclick="qs('${h.cmd.replace(/'/g,"\\'")}')">
      <div class="history-label">${h.cmd}</div>
      <div class="history-bar"><div class="history-bar-fill" style="width:${h.pct}%"></div></div>
      <div class="history-pct">${h.pct}%</div>
    </div>`).join("");
}

// ── Chat drawer ───────────────────────────────────────────────────────────────
window.toggleChat = function toggleChat(){
  chatOpen=!chatOpen;
  document.getElementById("chat-drawer").classList.toggle("open",chatOpen);
  document.getElementById("chat-toggle-label").textContent=chatOpen?"OCULTAR HISTORIAL":"VER HISTORIAL";
  document.getElementById("chat-toggle-btn").querySelector("span:first-child").textContent=chatOpen?"▼":"▲";
  if(chatOpen){
    const msgs=document.getElementById("msgs");
    setTimeout(()=>msgs.scrollTop=msgs.scrollHeight,420);
  }
}

window.qs = function qs(t){document.getElementById("ti").value=t;send();}

function addMsg(role, content, mediaType){
  const m = document.getElementById("msgs");
  const d = document.createElement("div");
  const t = new Date().toLocaleTimeString("es-MX",{hour:"2-digit",minute:"2-digit"});

  if(role === "user-img"){
    d.className = "msg user";
    d.innerHTML = `<div class="msg-av">${cu.substring(0,2).toUpperCase()}</div>
      <div><div class="msg-bubble" style="padding:4px">
        <img src="data:${mediaType};base64,${content}" style="max-width:200px;max-height:200px;border-radius:6px;display:block">
      </div><div class="msg-time">${t}</div></div>`;
  } else {
    d.className = "msg " + role;
    const av      = role === "user" ? cu.substring(0,2).toUpperCase() : "V";
    const rendered = role === "assistant" ? mdToHtml(content) : content;
    d.innerHTML = `<div class="msg-av">${av}</div><div><div class="msg-bubble">${rendered}</div><div class="msg-time">${t}</div></div>`;
  }
  m.appendChild(d);
  m.scrollTop = m.scrollHeight;
}

function addTyping(){
  const m=document.getElementById("msgs");
  const d=document.createElement("div");
  d.className="msg assistant"; d.id="ty";
  d.innerHTML="<div class='msg-av'>V</div><div class='msg-bubble'><div class='typing'><span></span><span></span><span></span></div></div>";
  m.appendChild(d); m.scrollTop=m.scrollHeight;
}
function removeTyping(){const t=document.getElementById("ty");if(t)t.remove();}

// ── Voz ───────────────────────────────────────────────────────────────────────
function initSR(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR)return null;
  const r=new SR(); r.lang="es-MX"; r.continuous=false; r.interimResults=true;
  r.onresult=e=>{
    const txt=Array.from(e.results).map(x=>x[0].transcript).join("");
    document.getElementById("transcript").textContent=txt;
    if(e.results[e.results.length-1].isFinal){
      document.getElementById("ti").value=txt;
      stopMic(); send();
    }
  };
  r.onerror=()=>stopMic();
  r.onend=()=>{ if(isRec) stopMic(); };
  return r;
}

window.toggleMic = function toggleMic(){
  if(!rec)rec=initSR();
  if(!rec){alert("Micrófono no disponible");return;}
  isRec?stopMic():startMic();
}
function startMic(){
  isRec=true;
  document.getElementById("micBtn").classList.add("recording");
  setAnimState("listening");
  rec.start();
}
function stopMic(){
  isRec=false;
  document.getElementById("micBtn").classList.remove("recording");
  setAnimState("idle");
  try{rec.stop();}catch(e){}
}

// ── TTS MEJORADO CON gTTS ──
let _audioPlayer = new Audio();
let _speakQueue = [];
let _isSpeaking = false;
let _ttsCache = {}; // {hash: audio_url}

function hashText(t){
  let h=0, i;
  for(i=0; i<t.length; i++){
    h=((h<<5)-h)+t.charCodeAt(i);
    h=h&h; // Convertir a 32-bit integer
  }
  return "tts_"+Math.abs(h);
}

async function playAudio(text){
  if(!text) return;
  const clean = text.replace(/[*][*]/g,"").replace(/[*]/g,"").replace(/[`]/g,"").replace(/[#]{1,3} /g,"").trim();
  if(!clean) return;
  
  const hash = hashText(clean);
  let audioUrl = _ttsCache[hash];
  
  if(!audioUrl){
    try {
      setAnimState("speaking");
      const r = await fetch("/api/tts", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({text: clean})
      });
      if(!r.ok) throw new Error("TTS error");
      
      const blob = await r.blob();
      audioUrl = URL.createObjectURL(blob);
      _ttsCache[hash] = audioUrl;
    } catch(e){
      console.error("[TTS] Error:", e);
      setAnimState("idle");
      _isSpeaking = false;
      speakNext();
      return;
    }
  }
  
  _audioPlayer.src = audioUrl;
  _audioPlayer.onended = () => {
    setAnimState("idle");
    _isSpeaking = false;
    speakNext();
  };
  _audioPlayer.onerror = () => {
    setAnimState("idle");
    _isSpeaking = false;
    speakNext();
  };
  
  try {
    await _audioPlayer.play();
  } catch(e){
    console.error("[TTS] Play error:", e);
    _isSpeaking = false;
    setAnimState("idle");
    speakNext();
  }
}

function speakNext(){
  if(_isSpeaking || _speakQueue.length === 0) return;
  _isSpeaking = true;
  const text = _speakQueue.shift();
  playAudio(text);
}

function speakText(t){
  if(!tts || !t) return;
  _speakQueue.push(t);
  speakNext();
}

// ── Markdown simple → HTML ────────────────────────────────────────────────────
function mdToHtml(text){
  if(!text) return "";
  var t = text;
  // Bold **text**
  t = t.split("**").reduce(function(acc,part,i){
    return acc + (i%2===1 ? "<strong>"+part+"</strong>" : part);
  });
  // Italic *text* — solo si hay pares
  var parts = t.split("*");
  if(parts.length > 2){
    t = parts.reduce(function(acc,part,i){
      return acc + (i%2===1 ? "<em>"+part+"</em>" : part);
    });
  }
  // Code `text`
  var cparts = t.split("`");
  if(cparts.length > 2){
    t = cparts.reduce(function(acc,part,i){
      return acc + (i%2===1 ? "<code style='background:rgba(0,212,255,.1);padding:1px 5px;border-radius:3px;font-size:11px'>"+part+"</code>" : part);
    });
  }
  // Line breaks
  t = t.replace(/\n\n/g, "<br><br>").replace(/\n/g, "<br>");
  // Headers
  t = t.replace(/### (.+)/g, "<span style='font-weight:600;color:var(--cyan)'>$1</span>");
  t = t.replace(/## (.+)/g,  "<span style='font-weight:600;color:var(--cyan)'>$1</span>");
  t = t.replace(/# (.+)/g,   "<span style='font-weight:600;color:var(--cyan)'>$1</span>");
  // List items
  t = t.replace(/^- (.+)/gm, "• $1");
  return t;
}

function msToTime(ms){if(!ms)return"0:00";const s=Math.floor(ms/1000);return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");}
let _lastTrackUri = null;

async function pollSpotify(){
  if(!spotifyConnected){
    try{
      const s  = await fetch("/spotify/status");
      const sd = await s.json();
      if(sd.connected) updateSpotifyPanel(true);
      else return;
    } catch(e){ return; }
  }
  try{
    const r = await fetch("/spotify/now-playing");
    if(r.status === 204){
      const tn = document.getElementById("track-name");
      if(tn) tn.textContent = "Sin reproducción activa";
      _lastTrackUri = null;
      return;
    }
    const d = await r.json();
    if(!d || !d.name) return;

    // Detectar cambio de canción
    const newUri = d.uri || d.name;
    if(newUri !== _lastTrackUri){
      _lastTrackUri = newUri;
      // Actualizar album art solo cuando cambia la canción
      const artEl = document.getElementById("album-art");
      if(artEl && d.image){
        artEl.innerHTML = `<img src="${d.image}" alt="album" style="width:100%;height:100%;object-fit:cover;border-radius:8px">`;
      } else if(artEl && !d.image){
        artEl.innerHTML = `<span style="font-size:28px">♪</span>`;
      }
    }

    const tn = document.getElementById("track-name");
    const ta = document.getElementById("track-artist");
    const pf = document.getElementById("progress-fill");
    const pc = document.getElementById("prog-cur");
    const pt = document.getElementById("prog-total");

    if(tn) tn.textContent = d.name;
    if(ta) ta.textContent = d.artist;
    const pct = d.duration ? Math.round((d.progress / d.duration) * 100) : 0;
    if(pf) pf.style.width = pct + "%";
    if(pc) pc.textContent = msToTime(d.progress);
    if(pt) pt.textContent = msToTime(d.duration);
  }catch(e){}
}

// ── Finanzas ──────────────────────────────────────────────────────────────────
// Presupuesto mensual fijo (ajustable)
const MONTHLY_BUDGET = 28051; // sueldo neto mensual
const AUTO_DEBT      = 300000; // deuda auto inicial

async function loadFinances(){
  try {
    const r    = await fetch("/api/financial");
    const resp = await r.json();

    // Nuevo formato: {transactions: [...], config: {monthly_budget, auto_debt}}
    const transactions = resp.transactions || resp || [];
    const config       = resp.config || {};
    const budget = config.monthly_budget || MONTHLY_BUDGET;
    const autoDbt= config.auto_debt      || AUTO_DEBT;

    const now   = new Date();
    const month = now.getMonth();
    const year  = now.getFullYear();

    let spent = 0;
    let totalAbonos = 0;

    transactions.forEach(item => {
      const dateStr = item.date || item.created_at || "";
      const d = new Date(dateStr.replace(" ","T"));
      const sameMonth = !isNaN(d.getTime()) && d.getMonth()===month && d.getFullYear()===year;
      if(item.action === "registrar_gasto" && sameMonth){
        spent += (parseFloat(item.amount) || 0);
      }
    });

    // El backend YA actualiza monthly_budget (es el disponible después de gastos)
    // No restamos de nuevo
    const deudaRestante = autoDbt;
    const available     = budget; // monthly_budget ya es lo disponible
    const originalBudget = MONTHLY_BUDGET; // Presupuesto original (28051)
    const pct = Math.min(100, Math.round(((originalBudget - available) / originalBudget) * 100));

    const elAvail = document.getElementById("finance-available");
    const elSpent = document.getElementById("finance-spent");
    const elDebt  = document.getElementById("finance-debt");
    const elBar   = document.getElementById("finance-bar-fill");
    const elLabel = document.getElementById("finance-bar-label");

    if(elAvail) elAvail.textContent = "$" + Math.round(available).toLocaleString("es-MX");
    if(elSpent) elSpent.textContent = "$" + Math.round(spent).toLocaleString("es-MX");
    if(elDebt)  elDebt.textContent  = deudaRestante > 0 ? "$" + Math.round(deudaRestante/1000)+"k" : "✅ Liquidada";
    if(elBar)   elBar.style.width   = pct + "%";
    if(elLabel) elLabel.textContent = pct + "% del presupuesto";

    if(elAvail){
      elAvail.style.color = available < 0 ? "var(--red)" : available < 5000 ? "#f59e0b" : "var(--green)";
    }
    console.log("[FINANCE] disponible=$"+Math.round(available)+" gastado=$"+Math.round(spent)+" budget=$"+budget);
  } catch(e) {
    console.error("[FINANCE] Error:", e);
  }
}

// Routine polling REMOVIDO (morning routine fue eliminado)}

function handleRoutinePhase(phase, data){
  const modal    = document.getElementById("routine-modal");
  const phLabel  = document.getElementById("routine-phase-label");
  const title    = document.getElementById("routine-title");
  const subtitle = document.getElementById("routine-subtitle");
  const ytWrap   = document.getElementById("routine-yt");
  const ytCont   = document.getElementById("routine-yt-container");
  const speech   = document.getElementById("routine-speech");

  modal.classList.add("active");

  // Ocultar secciones por defecto
  ytWrap.style.display  = "none";
  speech.style.display  = "none";
  subtitle.textContent  = "";

  if(phase === "ambient"){
    phLabel.textContent = "FASE 1 · 4:40 AM";
    title.textContent   = "Música Ambiental";
    subtitle.textContent = "Despertando suavemente...";
    ytWrap.style.display = "block";
    // Buscar en YouTube embed
    const query = encodeURIComponent(data.youtube_query || "musica ambiental despertar naturaleza");
    ytCont.innerHTML = `<iframe
      src="https://www.youtube.com/embed?listType=search&list=${query}&autoplay=1&mute=0&controls=1"
      allow="autoplay; encrypted-media" allowfullscreen>
    </iframe>`;
    setAnimState("speaking");

  } else if(phase === "speech"){
    phLabel.textContent  = "FASE 2 · 5:00 AM";
    title.textContent    = "Buenos Días";
    ytWrap.style.display = "none";
    // Cerrar YouTube
    ytCont.innerHTML = "";
    const speechText = data.speech || "Buenos días, señor.";
    speech.style.display  = "block";
    speech.textContent    = speechText;
    // Hablar el speech
    speakText(speechText);
    // Mostrar clima
    if(data.weather?.temp_c){
      subtitle.textContent = `${data.weather.temp_c}°C · ${data.weather.description || ""}`;
    }

  } else if(phase === "weather_song"){
    phLabel.textContent  = "FASE 3 · 5:10 AM";
    const song = data.song || {};
    title.textContent    = song.title || "Canción del día";
    subtitle.textContent = `${song.artist || ""} · ${song.reason || ""}`;
    speech.style.display  = "none";
    ytWrap.style.display  = "none";
    setAnimState("idle");

  } else if(phase === "done"){
    closeRoutineModal();
  }
}

  const modal = document.getElementById("routine-modal");

  document.getElementById("routine-yt-container").innerHTML = "";
  _routinePhase = null;

}
